name: editflow
description: "Freelance project management for video editors"
publish_to: 'none'
version: 2.2.4+8

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.3
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  fl_chart: ^0.70.2
  shared_preferences: ^2.3.5
  intl: ^0.20.2
  connectivity_plus: ^6.1.2
  url_launcher: ^6.3.2
  share_plus: any
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  file_picker: ^8.0.0
  path_provider: ^2.1.5
  qr_flutter: ^4.1.0
  record: ^6.2.1
  audioplayers: ^6.0.0
  video_player: ^2.8.2
  flutter_displaymode: ^0.6.0
  cross_file: any
  google_fonts: ^8.1.0
  flutter_local_notifications: ^22.0.1
  flutter_foreground_task: ^9.2.2
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/google_logo.png
    - assets/images/whatsapp_logo.png
    - assets/images/app_logo.png
    - assets/images/app_logo_qr.png
    - assets/images/upi_logo.png
